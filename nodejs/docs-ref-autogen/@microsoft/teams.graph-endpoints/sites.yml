      query options are also supported and described below: In addition, you can
      use a $search query against the /sites collection to find sites matching
      given keywords.

      If you want to list all sites across all geographies, refer to
      getAllSites. For more guidance about building applications that use site
      discovery for scanning purposes, see Best practices for discovering files
      and detecting changes at scale.
