variables:
  - name: resetPassword
    uid: '@microsoft/teams.graph-endpoints.me.authentication.methods.resetPassword'
    package: '@microsoft/teams.graph-endpoints'
    summary: ''
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        resetPassword: { /** * `POST
        /me/authentication/methods/{authenticationMethod-id}/resetPassword` * *
        Reset a user&#x27;s password, represented by a password authentication
        method object. This can only be done by an administrator with
        appropriate permissions and can&#x27;t be performed on a user&#x27;s own
        account. To reset a user&#x27;s password in Azure AD B2C, use the Update
        user API operation and update the passwordProfile &gt;
        forceChangePasswordNextSignIn object. This flow writes the new password
        to Microsoft Entra ID and pushes it to on-premises Active Directory if
        configured using password writeback. The admin can either provide a new
        password or have the system generate one. The user is prompted to change
        their password on their next sign in. This reset is a long-running
        operation and returns a Location header with a link where the caller can
        periodically check for the status of the reset operation. */ create:
        (body: IEndpoints["POST
        /me/authentication/methods/{authenticationMethod-id}/resetPassword"]["body"],
        params?: IEndpoints["POST
        /me/authentication/methods/{authenticationMethod-id}/resetPassword"]["parameters"])
        => EndpointRequest<IEndpoints["POST
        /me/authentication/methods/{authenticationMethod-id}/resetPassword"]["response"]>;
        }
      return:
        description: ''
        type: >-
          { /** * `POST
          /me/authentication/methods/{authenticationMethod-id}/resetPassword` *
          * Reset a user&#x27;s password, represented by a password
          authentication method object. This can only be done by an
          administrator with appropriate permissions and can&#x27;t be performed
          on a user&#x27;s own account. To reset a user&#x27;s password in Azure
          AD B2C, use the Update user API operation and update the
          passwordProfile &gt; forceChangePasswordNextSignIn object. This flow
          writes the new password to Microsoft Entra ID and pushes it to
          on-premises Active Directory if configured using password writeback.
          The admin can either provide a new password or have the system
          generate one. The user is prompted to change their password on their
          next sign in. This reset is a long-running operation and returns a
          Location header with a link where the caller can periodically check
          for the status of the reset operation. */ create: (body:
          IEndpoints["POST
          /me/authentication/methods/{authenticationMethod-id}/resetPassword"]["body"],
          params?: IEndpoints["POST
          /me/authentication/methods/{authenticationMethod-id}/resetPassword"]["parameters"])
          =&gt; EndpointRequest&lt;IEndpoints["POST
          /me/authentication/methods/{authenticationMethod-id}/resetPassword"]["response"]&gt;;
          }
