    syntax:
      content: >-
        setUserPreferredPresence: { /** * `POST
        /users/{user-id}/presence/setUserPreferredPresence` * * Set the
        preferred availability and activity status for a user. If the preferred
        presence of a user is set, the user&#x27;s presence shows as the
        preferred status. Preferred presence takes effect only when at least one
        presence session exists for the user. Otherwise, the user&#x27;s
        presence shows as Offline. A presence session is created as a result of
        a successful setPresence operation, or if the user is signed in on a
        Microsoft Teams client. For more details, see presence sessions and
        time-out and expiration. */ create: (body: IEndpoints["POST
