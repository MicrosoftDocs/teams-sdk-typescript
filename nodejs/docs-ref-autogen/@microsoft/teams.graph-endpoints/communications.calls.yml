          Records a short audio response from the caller. A bot can utilize this
          to capture a voice response from a caller after they are prompted for
          a response. For further information on how to handle operations,
          please review commsOperation This action is not intended to record the
          entire call. The maximum length of recording is 2 minutes. The
          recording is not saved permanently by the Cloud Communications
          Platform and is discarded shortly after the call ends. The bot must
          download the recording promptly after the recording operation finishes
