    uid: '@microsoft/teams.graph-endpoints.solutions.bookingBusinesses.create'
    package: '@microsoft/teams.graph-endpoints'
    summary: >-
      `POST /solutions/bookingBusinesses`


      Create a new Microsoft Bookings business in a tenant. This is the first
      step in setting up a Bookings business where you must specify the business
      display name. You can include other information such as business address,
      web site address, and scheduling policy, or set that information later by
      updating the bookingBusiness.
