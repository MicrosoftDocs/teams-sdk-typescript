methods:
  - name: first(IFileListOptions)
    uid: '@microsoft/teams.apps.IFilesAccessor.first'
    package: '@microsoft/teams.apps'
    summary: >-
      Convenience: the first listed file/inline image, or `undefined` when none.
      Sugar over `list()[0]`; shares `list()`'s resolution so it stays correct
      when later scopes hydrate through Graph.

      Filter by attachment style using the
      [IFileListOptions.attachmentStyle](xref:@microsoft/teams.apps.IFileListOptions.attachmentStyle)
      option.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function first(options?: IFileListOptions): Promise<IIncomingFile |
        undefined>
      parameters:
        - id: options
          type: <xref uid="@microsoft/teams.apps.IFileListOptions" />
          description: ''
      return:
        description: ''
        type: >-
          Promise&lt;<xref uid="@microsoft/teams.apps.IIncomingFile" /> |
          undefined&gt;
  - name: list(IFileListOptions)
    uid: '@microsoft/teams.apps.IFilesAccessor.list'
    package: '@microsoft/teams.apps'
    summary: >-
      The files attached to the current inbound activity. Async because later
      scopes hydrate through Graph; the personal path resolves synchronously
      from the activity but keeps the async signature so the shape never breaks.


      Returns uploaded files and inline images, and makes no network requests.

      Filter by attachment style using the
      [IFileListOptions.attachmentStyle](xref:@microsoft/teams.apps.IFileListOptions.attachmentStyle)
      option.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function list(options?: IFileListOptions): Promise<IIncomingFile[]>'
      parameters:
        - id: options
          type: <xref uid="@microsoft/teams.apps.IFileListOptions" />
          description: ''
      return:
        description: ''
        type: Promise&lt;<xref uid="@microsoft/teams.apps.IIncomingFile" />[]&gt;
