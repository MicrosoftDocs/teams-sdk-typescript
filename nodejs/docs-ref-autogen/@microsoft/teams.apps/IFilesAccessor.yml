### YamlMime:TSType
name: IFilesAccessor
uid: '@microsoft/teams.apps.IFilesAccessor'
package: '@microsoft/teams.apps'
summary: >-
  Accessor for the uploaded files and inline images on the current inbound
  activity, exposed as `ctx.files`.

  "Files" is a filter over the raw `ctx.activity.attachments` array.


  - Uploaded files arrive with `contentType` set to `file.download.info` and
  file metadata rather than the attachment's bytes themselves.

  The metadata names where the bytes live: a pre-authorized `downloadUrl` when
  issued, otherwise a `contentUrl` resolvable by Graph.

  What matters is how the content arrived, not its MIME type, so any file type
  (pdf, docx, png, etc.) sent as an uploaded file is listed.


  - Images pasted inline into the message are included, with
  [IIncomingFile.attachmentStyle](xref:@microsoft/teams.apps.IIncomingFile.attachmentStyle)
  set to `inlineImage`.

  An inline image not hosted on the activity's service URL is skipped with a
  warning.

  See [AttachmentStyle](xref:@microsoft/teams.apps.AttachmentStyle) for image
  formats that cannot be downloaded.


  This accessor maps each listed attachment to an
  [IIncomingFile](xref:@microsoft/teams.apps.IIncomingFile), and skips other
  `attachments` content (adaptive cards, mentions, etc.) and malformed file
  entries, never throwing.

  For each file returned, the original wire attachment (metadata) is retained on
  [IIncomingFile.raw](xref:@microsoft/teams.apps.IIncomingFile.raw).

  A malformed or non-file attachment is reachable only through the raw
  `activity.attachments` array.
fullName: IFilesAccessor
remarks: ''
isDeprecated: false
