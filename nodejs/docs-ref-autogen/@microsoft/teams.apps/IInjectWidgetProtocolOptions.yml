### YamlMime:TSType
name: IInjectWidgetProtocolOptions
uid: '@microsoft/teams.apps.IInjectWidgetProtocolOptions'
package: '@microsoft/teams.apps'
summary: |-
  Options for injecting the MCP Apps protocol into widget HTML.

   This API is in preview and may change in the future.
  Diagnostic: ExperimentalTeamsHtmlWidget
fullName: IInjectWidgetProtocolOptions
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: appCapabilities
    uid: '@microsoft/teams.apps.IInjectWidgetProtocolOptions.appCapabilities'
    package: '@microsoft/teams.apps'
    summary: |-
      Capabilities declared to the host during the `ui/initialize` handshake.
      Sent as `appCapabilities` in the init request per the MCP Apps spec.
    fullName: appCapabilities
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        appCapabilities?: { availableDisplayModes?: ("inline" | "fullscreen" |
        "pip")[] }
      return:
        description: ''
        type: '{ availableDisplayModes?: ("inline" | "fullscreen" | "pip")[] }'
  - name: debugCspViolations
    uid: '@microsoft/teams.apps.IInjectWidgetProtocolOptions.debugCspViolations'
    package: '@microsoft/teams.apps'
    summary: >-
      When true, injects a `securitypolicyviolation` event listener that logs
      CSP violations to the console.

      This catches dynamically constructed URLs that static analysis
      ([validateSecurityPolicy](xref:@microsoft/teams.apps.validateSecurityPolicy))
      cannot detect.


      Should only be enabled during development.
    fullName: debugCspViolations
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'debugCspViolations?: boolean'
      return:
        description: ''
        type: boolean
  - name: name
    uid: '@microsoft/teams.apps.IInjectWidgetProtocolOptions.name'
    package: '@microsoft/teams.apps'
    summary: The widget app name sent during ui/initialize.
    fullName: name
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'name?: string'
      return:
        description: ''
        type: string
  - name: notifications
    uid: '@microsoft/teams.apps.IInjectWidgetProtocolOptions.notifications'
    package: '@microsoft/teams.apps'
    summary: >-
      Host notifications to listen for. These correspond to JSON-RPC methods

      defined in the MCP Apps spec under `ui/notifications/*`. For each

      notification included, define the matching `window.onX` callback in

      your widget HTML to handle it.


      Known notifications (from the MCP Apps spec):

      - `'tool-result'` (`ui/notifications/tool-result`) - define
      `window.onToolResult`

      - `'tool-input'` (`ui/notifications/tool-input`) - define
      `window.onToolInput`

      - `'tool-input-partial'` (`ui/notifications/tool-input-partial`) - define
      `window.onToolInputPartial`

      - `'tool-cancelled'` (`ui/notifications/tool-cancelled`) - define
      `window.onToolCancelled`

      - `'host-context-changed'` (`ui/notifications/host-context-changed`) -
      define `window.onHostContextChanged`

      - `'resource-teardown'` (`ui/notifications/resource-teardown`) - define
      `window.onResourceTeardown`


      Unknown notification names are ignored (only the above are injected).
    fullName: notifications
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'notifications?: WidgetNotification[]'
      return:
        description: ''
        type: WidgetNotification[]
  - name: version
    uid: '@microsoft/teams.apps.IInjectWidgetProtocolOptions.version'
    package: '@microsoft/teams.apps'
    summary: The widget app version sent during ui/initialize.
    fullName: version
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'version?: string'
      return:
        description: ''
        type: string
