  - name: token
    uid: '@microsoft/teams.apps.IHttpServerRequest.token'
    package: '@microsoft/teams.apps'
    summary: >-
      Pre-authenticated caller identity, supplied by transports that establish

      authenticity at the connection level rather than per request (e.g. Socket

      Mode, which authenticates once during its negotiate handshake and carries
      no

      per-frame JWT). When set,
      [IHttpServer](xref:@microsoft/teams.apps.IHttpServer) trusts it and skips
      per-request

      token validation for this request.


      HTTP adapters leave this `undefined` so the normal `Authorization`-header
      JWT

      validation runs. Only trusted transport adapters should populate it —
      doing

      so bypasses inbound token validation, exactly like terminating auth in a

      custom adapter.
    fullName: token
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'token?: IToken'
      return:
        description: ''
        type: <xref uid="@microsoft/teams.api.IToken" />
