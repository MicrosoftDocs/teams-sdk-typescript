  - name: filesCredential
    uid: '@microsoft/teams.apps.IActivityContextConstructorArgs.filesCredential'
    package: '@microsoft/teams.apps'
    summary: >-
      Graph credential used by the file path, selected per actor and resolved at
      fetch time.


      Constructor-only, and deliberately absent from
      [IBaseActivityContextOptions](xref:@microsoft/teams.apps.IBaseActivityContextOptions):
      it exists so `ctx.files` can reach bytes the pre-authorized download URL
      cannot, and a handler has no reason to hold it. Declaring it here keeps it
      off the public context type and out of the instance, rather than
      advertising a property that is always `undefined`.
    fullName: filesCredential
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'filesCredential?: GraphCredential'
      return:
        description: ''
        type: GraphCredential
