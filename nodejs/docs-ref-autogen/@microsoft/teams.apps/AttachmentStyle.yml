### YamlMime:TSTypeAlias
name: AttachmentStyle
uid: '@microsoft/teams.apps.AttachmentStyle'
package: '@microsoft/teams.apps'
summary: >-
  How a file was attached to the inbound message.

  - `file`: sent as a file attachment

  - `inlineImage`: pasted into the message body


  Some image formats, such as BMP and AVIF, cannot be converted by the Teams
  service, so Teams shows a placeholder, and they cannot be downloaded.

  The same image sent as a file attachment downloads normally.
fullName: AttachmentStyle
remarks: ''
isDeprecated: false
syntax: |
  type AttachmentStyle = "file" | "inlineImage"
