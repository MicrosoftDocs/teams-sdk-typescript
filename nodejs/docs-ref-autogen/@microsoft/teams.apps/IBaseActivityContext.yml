  - name: stream
    uid: '@microsoft/teams.apps.IBaseActivityContext.stream'
    package: '@microsoft/teams.apps'
    summary: >-
      a stream that can emit activity chunks


      The first message of the stream goes to the reply chain (thread) where
      `send` would place a response.

      In a chat the stream starts in the thread when the inbound activity is in
      a thread, and at top level otherwise.

      In a channel the stream starts in the reply chain of the inbound message.

      In a channel, when the service answers HTTP 404, the first message of the
      stream is created in the inbound conversation instead.

      Without `channelData.replyChain.id` the stream is not placed in a reply
      chain.
    fullName: stream
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'stream: IStreamer'
      return:
        description: ''
        type: <xref uid="@microsoft/teams.apps.IStreamer" />
