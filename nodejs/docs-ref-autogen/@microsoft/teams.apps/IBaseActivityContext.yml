methods:
  - name: plan()
    uid: '@microsoft/teams.apps.IBaseActivityContext.plan'
    package: '@microsoft/teams.apps'
    summary: >-
      Get the Plan bound to this inbound activity. Use new Plan(options) for a
      saved prompt.

      In a chat thread, a standalone `complete()` is posted to the reply chain,
      as `ctx.send` does.

      Typing updates, completions in a channel, and prompts outside a thread use
      the conversation.

       This API is in preview and may change in the future.
      Diagnostic: ExperimentalTeamsPlan
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function plan(): Plan'
      return:
        description: ''
        type: <xref uid="@microsoft/teams.apps.Plan" />
