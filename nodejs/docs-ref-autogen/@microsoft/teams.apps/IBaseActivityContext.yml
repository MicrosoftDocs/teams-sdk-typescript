  - name: reply(ActivityLike)
    uid: '@microsoft/teams.apps.IBaseActivityContext.reply_1'
    package: '@microsoft/teams.apps'
    summary: >-
      reply to the inbound activity, automatically quoting the inbound message


      In a chat, sends into the reply chain (thread) when the inbound activity
      is inside one, and at top level otherwise.

      The inbound activity can be a message, a card action, an invoke, a
      reaction, an edit or a delete.

      In a channel, sends into the reply chain of the inbound message.

      In a channel, when the service answers HTTP 404, sends to the inbound
      conversation instead.

      Inbound activities without `channelData.replyChain.id`, and other inbound
      activities, are not placed, and the activity is sent to the inbound
      conversation.

      The response is automatically quoted only when the inbound activity id is
      a plain numeric message id.

      Otherwise (for example an invoke or a card action with a service-generated
      `f:` id) the activity is sent without a quote, exactly like
      [send](xref:@microsoft/teams.apps.IBaseActivityContext.send_5).

      Explicit quotes through
      [quote](xref:@microsoft/teams.apps.IBaseActivityContext.quote_2) are
      unchanged.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function reply(activity: ActivityLike): Promise<SentActivity>'
      parameters:
        - id: activity
          type: <xref uid="@microsoft/teams.api.ActivityLike" />
          description: activity to send
      return:
        description: ''
        type: Promise&lt;<xref uid="@microsoft/teams.api.SentActivity" />&gt;
