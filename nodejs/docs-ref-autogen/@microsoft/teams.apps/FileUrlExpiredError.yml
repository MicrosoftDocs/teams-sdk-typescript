### YamlMime:TSType
name: FileUrlExpiredError
uid: '@microsoft/teams.apps.FileUrlExpiredError'
package: '@microsoft/teams.apps'
summary: >-
  Raised when an inbound file's short-lived download URL has expired and can no
  longer fetch bytes.


  A personal file's pre-authorized `tempauth` download URL is valid only
  briefly. A fetch after it lapses gets a `401`/`403` from the platform. A
  handler that downloads once (and does not keep the handle) should not hit
  this. `reason` distinguishes the two cases:

  - `firstFetch`: the first fetch came after the URL lapsed, so no bytes were
  retrieved. There is no recovery: the URL carried its own credential, and the
  SDK does not fall back to Graph with an app identity. The file has to be sent
  again.

  - `reread`: edge case. An earlier download succeeded, then a later re-fetch
  through the same handle lapsed. Avoid it by calling `download()` once and
  reusing the returned `DownloadedFile` rather than re-reading the handle.
fullName: FileUrlExpiredError
remarks: ''
isDeprecated: false
type: class
