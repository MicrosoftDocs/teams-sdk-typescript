name: ISecurityPolicyWarning
uid: '@microsoft/teams.apps.ISecurityPolicyWarning'
package: '@microsoft/teams.apps'
summary: >-
  A warning produced by
  [validateSecurityPolicy](xref:@microsoft/teams.apps.validateSecurityPolicy)
  when the widget HTML

  references an external origin that is not present in the declared security

  policy.

   This API is in preview and may change in the future.
  Diagnostic: ExperimentalTeamsHtmlWidget
