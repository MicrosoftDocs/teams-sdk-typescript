### YamlMime:TSTypeAlias
name: IFunctionContextOptions
uid: '@microsoft/teams.apps.IFunctionContextOptions'
package: '@microsoft/teams.apps'
summary: >-
  Options used to construct a
  [FunctionContext](xref:@microsoft/teams.apps.FunctionContext). The owning
  `App` supplies

  the client context (resolved from the request's auth token) plus the

  collaborators the context needs to resolve a conversation and send activities.
fullName: IFunctionContextOptions<T>
remarks: ''
isDeprecated: false
syntax: |
  type IFunctionContextOptions<T> = IClientContext & {
    activitySender: IActivitySender
    api: ApiClient
    appGraph: GraphClient
    botId?: string
    data: T
    log: ILogger
  }
