### YamlMime:TSType
name: IFileReadOptions
uid: '@microsoft/teams.apps.IFileReadOptions'
package: '@microsoft/teams.apps'
summary: >-
  Options accepted by the byte-reading methods on
  [IIncomingFile](xref:@microsoft/teams.apps.IIncomingFile), and by
  [IDownloadedFile.saveAs](xref:@microsoft/teams.apps.IDownloadedFile.saveAs).
fullName: IFileReadOptions
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: signal
    uid: '@microsoft/teams.apps.IFileReadOptions.signal'
    package: '@microsoft/teams.apps'
    summary: >-
      Cancels the read. Aborts the in-flight request and, for
      [IIncomingFile.saveAs](xref:@microsoft/teams.apps.IIncomingFile.saveAs),
      stops the write loop rather than letting an already-open download run to
      completion.


      Worth passing on any read a caller might want to bound: a fetch is a
      network call against storage the SDK does not control, and may make more
      than one request.
    fullName: signal
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'signal?: AbortSignal'
      return:
        description: ''
        type: AbortSignal
