### YamlMime:TSType
name: Plan
uid: '@microsoft/teams.apps.Plan'
package: '@microsoft/teams.apps'
summary: >-
  Sends prompt-bound Plan activities; the application owns ordering and
  concurrency.

  Serialize the IDs with JSON.stringify() and inject a client when
  reconstructing.


  Targeted Plan scenarios are not supported.

  Plans use ordinary create routing, and completion() does not inherit

  targeting from the originating context.


  In a chat thread, complete() is posted to the reply chain like `ctx.send`.

  Typing updates (start, update, stop, error) are sent to the conversation, as
  `ctx.send` does for typing activities.

   This API is in preview and may change in the future.
  Diagnostic: ExperimentalTeamsPlan
fullName: Plan
remarks: ''
isDeprecated: false
