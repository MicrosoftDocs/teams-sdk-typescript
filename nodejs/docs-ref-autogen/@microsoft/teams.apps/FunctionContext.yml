### YamlMime:TSType
name: FunctionContext
uid: '@microsoft/teams.apps.FunctionContext'
package: '@microsoft/teams.apps'
summary: >-
  Context handed to a remotely-callable function (`app.function`).


  Like [ActivityContext](xref:@microsoft/teams.apps.ActivityContext), this is a
  "smart" context: it owns conversation

  resolution and sending rather than having `App` wire those up at registration.

  That keeps `App.function` thin and mirrors the Python SDK's `FunctionContext`.
fullName: FunctionContext<T>
remarks: ''
isDeprecated: false
type: class
