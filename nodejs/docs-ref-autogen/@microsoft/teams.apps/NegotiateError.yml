name: NegotiateError
uid: '@microsoft/teams.apps.NegotiateError'
package: '@microsoft/teams.apps'
summary: >-
  Error thrown by <xref:negotiate> when the service returns a non-2xx status.

  Carries the HTTP status and the parsed `Retry-After` (in milliseconds) when

  the service asked the caller to back off — typically on `429` or `503` — so

  the reconnect supervisor can honor it instead of using its own back-off.

  Authentication and authorization failures (`401`/`403`) are not retried;

  see
  [NegotiateError.isAuthError](xref:@microsoft/teams.apps.NegotiateError.isAuthError).
fullName: NegotiateError
remarks: ''
isDeprecated: false
type: class
