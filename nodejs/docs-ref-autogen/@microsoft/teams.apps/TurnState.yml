    isDeprecated: false
    syntax:
      content: 'function has(key: string): boolean'
      parameters:
        - id: key
          type: string
          description: Key to test.
      return:
        description: ''
        type: boolean
  - name: seal()
    uid: '@microsoft/teams.apps.TurnState.seal'
    package: '@microsoft/teams.apps'
    summary: Seals this scope so handlers cannot access it after the turn completes.
    remarks: ''
    isDeprecated: false
    syntax:
      content: function seal()
