    uid: '@microsoft/teams.apps.TurnState.set'
    package: '@microsoft/teams.apps'
    summary: |-
      Writes a value and marks this scope dirty.

      Values must be JSON-serializable when the turn is saved.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function set<T>(key: string, value: T): this'
      parameters:
        - id: key
          type: string
          description: Stable key used to persist the value.
        - id: value
          type: T
          description: Value to store.
      return:
