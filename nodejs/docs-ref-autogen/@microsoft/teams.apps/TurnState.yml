        description: ''
        type: boolean
  - name: isSealed
    uid: '@microsoft/teams.apps.TurnState.isSealed'
    package: '@microsoft/teams.apps'
    summary: Whether this scope has been sealed after turn processing.
    fullName: isSealed
    remarks: ''
    isDeprecated: false
    syntax:
      content: boolean isSealed
      return:
        description: ''
        type: boolean
  - name: size
    uid: '@microsoft/teams.apps.TurnState.size'
    package: '@microsoft/teams.apps'
    summary: Number of values in this scope.
    fullName: size
    remarks: ''
    isDeprecated: false
    syntax:
      content: number size
      return:
        description: ''
        type: number
methods:
  - name: clear()
    uid: '@microsoft/teams.apps.TurnState.clear'
    package: '@microsoft/teams.apps'
    summary: Removes every value. An already-empty scope remains clean.
    remarks: ''
    isDeprecated: false
    syntax:
      content: function clear()
  - name: delete(string)
    uid: '@microsoft/teams.apps.TurnState.delete'
    package: '@microsoft/teams.apps'
    summary: Removes a value. The scope is marked dirty only when the key existed.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function delete(key: string): boolean'
      parameters:
        - id: key
          type: string
          description: Key to remove.
      return:
        description: ''
        type: boolean
  - name: get<T>(string)
    uid: '@microsoft/teams.apps.TurnState.get'
    package: '@microsoft/teams.apps'
    summary: |-
      Reads a value from this scope.

      Reads never mark state dirty. Call `set` after changing mutable values so
      the scope is persisted at the end of the turn.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function get<T>(key: string): T | undefined'
      parameters:
        - id: key
          type: string
          description: Stable key used to persist the value.
      return:
        description: ''
        type: T | undefined
