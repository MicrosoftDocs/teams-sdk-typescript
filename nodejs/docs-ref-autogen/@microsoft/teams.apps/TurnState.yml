### YamlMime:TSType
name: TurnState
uid: '@microsoft/teams.apps.TurnState'
package: '@microsoft/teams.apps'
summary: >-
  Mutable key/value state scoped to one activity turn.


  Values are persisted as JSON at the end of the turn when the state is dirty.

  Instances are not thread-safe and must not be retained after the handler
  completes.
fullName: TurnState
remarks: ''
isDeprecated: false
type: class
constructors:
  - name: TurnState(Readonly<Record<string, unknown>>)
    uid: '@microsoft/teams.apps.TurnState.constructor'
    package: '@microsoft/teams.apps'
    summary: Creates turn state from an optional persisted snapshot.
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'new TurnState(data?: Readonly<Record<string, unknown>>)'
      parameters:
        - id: data
          type: Readonly&lt;Record&lt;string, unknown&gt;&gt;
          description: Initial values. Loading values does not mark the state dirty.
properties:
  - name: isDirty
    uid: '@microsoft/teams.apps.TurnState.isDirty'
    package: '@microsoft/teams.apps'
    summary: Whether this scope changed during the current turn.
    fullName: isDirty
    remarks: ''
    isDeprecated: false
    syntax:
      content: boolean isDirty
      return:
        description: ''
        type: boolean
  - name: isEmpty
    uid: '@microsoft/teams.apps.TurnState.isEmpty'
    package: '@microsoft/teams.apps'
