### YamlMime:TSType
name: FileCredentialError
uid: '@microsoft/teams.apps.FileCredentialError'
package: '@microsoft/teams.apps'
summary: >-
  Raised when no credential was available for the Graph call. Detectable before
  any HTTP request.


  Distinct from
  [FileUrlExpiredError](xref:@microsoft/teams.apps.FileUrlExpiredError), which
  means a pre-authorized URL lapsed and cannot be renewed. This means the Graph
  route was ruled out before the request, because no usable credential was
  available: either a token could not be acquired, or the one acquired carries
  no file-capable permission.
fullName: FileCredentialError
remarks: ''
isDeprecated: false
type: class
