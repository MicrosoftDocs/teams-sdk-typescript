        description: ''
        type: <xref uid="@microsoft/teams.apps.FileActor" />
  - name: cause
    uid: '@microsoft/teams.apps.FileCredentialError.cause'
    package: '@microsoft/teams.apps'
    summary: >-
      What went wrong while acquiring the token, when the attempt failed rather
      than simply returning nothing.


      An acquisition that threw and an identity with no permissions both arrive
      here as "no token", but the fixes differ: one is a transient or
      configuration fault, the other is a consent problem. Local to this
      process; contrast
      [FileAccessError.details](xref:@microsoft/teams.apps.FileAccessError.details),
      which is the service's own words.
    fullName: cause
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'cause?: string'
      return:
        description: ''
        type: string
