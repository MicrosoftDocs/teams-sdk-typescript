name: FileScopeNotSupportedError
uid: '@microsoft/teams.apps.FileScopeNotSupportedError'
package: '@microsoft/teams.apps'
summary: >-
  Raised when file bytes are requested for a conversation scope whose download
  path is not implemented.


  Only `personal` (1:1) uploaded files download directly. `groupChat` files are
  surfaced by `list()`, but fetching their bytes needs Graph;
  `download()`/`stream()` throws until that path lands.
fullName: FileScopeNotSupportedError
remarks: ''
isDeprecated: false
