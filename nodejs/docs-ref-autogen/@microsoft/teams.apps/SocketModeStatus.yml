### YamlMime:TSTypeAlias
name: SocketModeStatus
uid: '@microsoft/teams.apps.SocketModeStatus'
package: '@microsoft/teams.apps'
summary: >-
  Lifecycle status of the
  [SocketModeAdapter](xref:@microsoft/teams.apps.SocketModeAdapter) socket.


  - `idle` — created but not yet started.

  - `connecting` — negotiating and opening the socket, or reconnecting.

  - `ready` — socket is open AND the Teams backend service `SocketReady`
  readiness contract has
    been satisfied; inbound activities can be delivered.
  - `disconnected` — the socket closed. A reconnect may be in progress, unless
    negotiate was rejected with HTTP 401/403, in which case reconnecting stops
    until the app is restarted with corrected credentials or access.
  - `stopped` — the server was stopped and will not reconnect.

   This API is in preview and may change in the future.
fullName: SocketModeStatus
remarks: ''
isDeprecated: false
syntax: |
  type SocketModeStatus =
    | "idle"
    | "connecting"
    | "ready"
    | "disconnected"
    | "stopped"
