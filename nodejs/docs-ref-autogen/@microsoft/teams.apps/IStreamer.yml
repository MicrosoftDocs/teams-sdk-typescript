### YamlMime:TSType
name: IStreamer
uid: '@microsoft/teams.apps.IStreamer'
package: '@microsoft/teams.apps'
summary: component that can send streamed chunks of an activity
fullName: IStreamer
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: canceled
    uid: '@microsoft/teams.apps.IStreamer.canceled'
    package: '@microsoft/teams.apps'
    summary: |-
      whether the stream has been canceled.
      For example when the user pressed the Stop button.
    fullName: canceled
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'canceled: boolean'
      return:
        description: ''
        type: boolean
  - name: closed
    uid: '@microsoft/teams.apps.IStreamer.closed'
    package: '@microsoft/teams.apps'
    summary: |-
      whether the current streamed message has been finalized.

      Closing is idempotent until the next emit or update. Emitting or
      updating after close starts a new streamed message using the same
      stream instance.
    fullName: closed
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'closed: boolean'
      return:
        description: ''
        type: boolean
  - name: events
    uid: '@microsoft/teams.apps.IStreamer.events'
    package: '@microsoft/teams.apps'
    summary: ''
    fullName: events
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'events: Omit<IEventEmitter<IStreamerEvents>, "emit">'
      return:
        description: ''
        type: >-
          Omit&lt;<xref uid="@microsoft/teams.common.IEventEmitter" />&lt;<xref
          uid="@microsoft/teams.apps.IStreamerEvents" />&gt;, "emit"&gt;
methods:
  - name: clearText()
    uid: '@microsoft/teams.apps.IStreamer.clearText'
    package: '@microsoft/teams.apps'
    summary: |-
      Discard accumulated streamed text and any pending text deltas, so the
      final message sent by `close()` doesn't include them. Useful when a
      mid-turn decision (e.g. a tool call producing a card) means the
      buffered text should not appear in the final activity. Typing chunks
      already shipped to Teams are not undone, but the final message updates
      the same activity to reflect the cleared state.
    remarks: ''
    isDeprecated: false
    syntax:
      content: function clearText()
  - name: close()
    uid: '@microsoft/teams.apps.IStreamer.close'
    package: '@microsoft/teams.apps'
    summary: |-
      Finalize the current streamed message.

      Closing is idempotent until the next emit or update. Emitting or
      updating after close starts a new streamed message using the same
      stream instance.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function close(): undefined | SentActivity | Promise<undefined |
        SentActivity>
      return:
        description: ''
        type: >-
          undefined | <xref uid="@microsoft/teams.api.SentActivity" /> |
          Promise&lt;undefined | <xref uid="@microsoft/teams.api.SentActivity"
          />&gt;
  - name: emit(IMessageActivity | ITypingActivity)
    uid: '@microsoft/teams.apps.IStreamer.emit'
    package: '@microsoft/teams.apps'
    summary: ''
    remarks: ''
    isDeprecated: true
    customDeprecatedMessage: Use <xref:IMessageActivityInput> or <xref:ITypingActivityInput> instead.
    syntax:
      content: 'function emit(activity: IMessageActivity | ITypingActivity)'
      parameters:
        - id: activity
          type: >-
            <xref uid="@microsoft/teams.api.IMessageActivity" /> | <xref
            uid="@microsoft/teams.api.ITypingActivity" />
          description: ''
  - name: emit(string | IMessageActivityInput | ITypingActivityInput)
    uid: '@microsoft/teams.apps.IStreamer.emit_1'
    package: '@microsoft/teams.apps'
    summary: ''
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function emit(activity: string | IMessageActivityInput |
        ITypingActivityInput)
      parameters:
        - id: activity
          type: >-
            string | <xref uid="@microsoft/teams.api.IMessageActivityInput" /> |
            <xref uid="@microsoft/teams.api.ITypingActivityInput" />
          description: ''
  - name: update(string)
    uid: '@microsoft/teams.apps.IStreamer.update'
    package: '@microsoft/teams.apps'
    summary: send status updates before emitting (ex. "Thinking...")
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'function update(text: string)'
      parameters:
        - id: text
          type: string
          description: the status text to send
