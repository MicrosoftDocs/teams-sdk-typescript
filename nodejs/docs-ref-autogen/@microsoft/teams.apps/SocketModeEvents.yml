### YamlMime:TSTypeAlias
name: SocketModeEvents
uid: '@microsoft/teams.apps.SocketModeEvents'
package: '@microsoft/teams.apps'
summary: >-
  Lifecycle events emitted by
  [SocketModeAdapter.events](xref:@microsoft/teams.apps.SocketModeAdapter.events).
  Subscribe via

  `app.socketMode?.events.on('ready', ...)` to observe the socket lifecycle.

  Each payload carries the `geo` it relates to, since a bot maintains one

  connection per geo.

   This API is in preview and may change in the future.
fullName: SocketModeEvents
remarks: ''
isDeprecated: false
syntax: |
  type SocketModeEvents = {
    disconnected: { error?: Error; geo: string; terminal: boolean }
    ready: { frame: SocketReadyFrame; geo: string }
    reconnected: { geo: string }
  }
