    fullName: agentEmail
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'agentEmail?: string'
      return:
        description: ''
        type: string
  - name: agenticIdentity
    uid: '@microsoft/teams.apps.IAgent365Scope.agenticIdentity'
    package: '@microsoft/teams.apps'
    summary: >-
      The agentic identity scope the operation runs under, typically from

