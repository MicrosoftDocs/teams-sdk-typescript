### YamlMime:TSType
name: IAgent365Scope
uid: '@microsoft/teams.apps.IAgent365Scope'
package: '@microsoft/teams.apps'
summary: >-
  Identity a proactive Agent365 telemetry scope runs as. Per-operation only;

  host-wide policy is bound by
  [createAgent365Scope](xref:@microsoft/teams.apps.createAgent365Scope).
fullName: IAgent365Scope
remarks: ''
isDeprecated: false
type: interface
properties:
  - name: additionalBaggage
    uid: '@microsoft/teams.apps.IAgent365Scope.additionalBaggage'
    package: '@microsoft/teams.apps'
    summary: >-
      Extra baggage entries merged in last. These bypass the `include` gate,
      since

      the caller names each entry explicitly.
    fullName: additionalBaggage
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        additionalBaggage?:
        Agent365BaggageEntries<Agent365BaggageEntries<string,
        Agent365BaggageEntries>>
      return:
        description: ''
        type: >-
          <xref uid="@microsoft/teams.apps.Agent365BaggageEntries" />&lt;<xref
          uid="@microsoft/teams.apps.Agent365BaggageEntries" />&lt;string, <xref
          uid="@microsoft/teams.apps.Agent365BaggageEntries" />&gt;&gt;
  - name: agentDescription
    uid: '@microsoft/teams.apps.IAgent365Scope.agentDescription'
    package: '@microsoft/teams.apps'
    summary: |-
      Description of the agent. Personal data: only populated when the opener's
      `include` lists `agentDescription`.
    fullName: agentDescription
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'agentDescription?: string'
      return:
        description: ''
