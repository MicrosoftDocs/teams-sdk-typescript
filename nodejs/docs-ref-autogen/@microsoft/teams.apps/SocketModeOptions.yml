### YamlMime:TSTypeAlias
name: SocketModeOptions
uid: '@microsoft/teams.apps.SocketModeOptions'
package: '@microsoft/teams.apps'
summary: |-
  Options controlling the inbound Socket Mode transport, passed as
  `new App({ socketMode: { ... } })`. Passing `socketMode: true` uses all
  defaults.
  WebSocket is only recommended for use when developing agents.
  Socket Mode is currently only available for new bots.

   This API is in preview and may change in the future.
fullName: SocketModeOptions
remarks: ''
isDeprecated: false
syntax: >
  type SocketModeOptions = { geos?: readonly string[]; negotiateBaseUrl?: string
  }
