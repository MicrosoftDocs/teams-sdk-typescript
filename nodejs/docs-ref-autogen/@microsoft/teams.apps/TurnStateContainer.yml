    summary: Creates a loaded state container.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        new TurnStateContainer(conversation: TurnState, user?: TurnState,
        deleter?: StateDeleter)
      parameters:
        - id: conversation
          type: <xref uid="@microsoft/teams.apps.TurnState" />
          description: Conversation-scoped state.
        - id: user
          type: <xref uid="@microsoft/teams.apps.TurnState" />
          description: Optional user-within-conversation state.
        - id: deleter
          type: StateDeleter
          description: >-
            Optional callback that removes persisted scopes. Normally supplied
