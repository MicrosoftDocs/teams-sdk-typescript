name: TurnStateContainer
uid: '@microsoft/teams.apps.TurnStateContainer'
package: '@microsoft/teams.apps'
summary: Conversation and user state loaded for one activity turn.
fullName: TurnStateContainer
remarks: ''
isDeprecated: false
type: class
constructors:
  - name: TurnStateContainer(TurnState, TurnState, StateDeleter)
    uid: '@microsoft/teams.apps.TurnStateContainer.constructor'
