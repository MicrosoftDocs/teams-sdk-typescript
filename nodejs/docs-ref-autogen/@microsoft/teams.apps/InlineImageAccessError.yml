### YamlMime:TSType
name: InlineImageAccessError
uid: '@microsoft/teams.apps.InlineImageAccessError'
package: '@microsoft/teams.apps'
summary: >-
  Raised when the Bot API refused the token presented for an inline image,
  answering `401` or `403`.


  Inline images are read with the same Bot API token the app uses to reply in
  that conversation (an agentic user token for agentic identities), not Graph,
  so this is distinct from
  [FileAccessError](xref:@microsoft/teams.apps.FileAccessError).
fullName: InlineImageAccessError
remarks: ''
isDeprecated: false
