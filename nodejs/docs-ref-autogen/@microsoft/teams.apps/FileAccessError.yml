### YamlMime:TSType
name: FileAccessError
uid: '@microsoft/teams.apps.FileAccessError'
package: '@microsoft/teams.apps'
summary: >-
  Raised when the identity used was refused by the storage service.


  Distinct from
  [FileUrlExpiredError](xref:@microsoft/teams.apps.FileUrlExpiredError), which
  means a pre-authorized URL lapsed and cannot be renewed. This means the Graph
  route was the one that failed, refused by the service after the request was
  made.
fullName: FileAccessError
remarks: ''
isDeprecated: false
type: class
