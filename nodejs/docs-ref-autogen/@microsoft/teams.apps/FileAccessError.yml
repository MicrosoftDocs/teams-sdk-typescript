properties:
  - name: actor
    uid: '@microsoft/teams.apps.FileAccessError.actor'
    package: '@microsoft/teams.apps'
    summary: >-
      The identity the fetch was attempted as, when one was selected. Absent
      when the failure preceded credential selection.
    fullName: actor
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'actor?: FileActor'
      return:
        description: ''
        type: <xref uid="@microsoft/teams.apps.FileActor" />
  - name: details
    uid: '@microsoft/teams.apps.FileAccessError.details'
    package: '@microsoft/teams.apps'
    summary: >-
      What the storage service itself said, verbatim and truncated, when it said
      anything.


      A `403` covers an unconsented scope, a file the identity was never
      granted, and a drive item that does not exist, which are indistinguishable
      on the wire: Graph answers all three with `403`, because telling an
      unauthorized caller whether a resource exists would disclose it. That
      collapse is right for branching and wrong for diagnosis, so the original
      text is kept here rather than discarded.
    fullName: details
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'details?: string'
      return:
        description: ''
        type: string
  - name: status
    uid: '@microsoft/teams.apps.FileAccessError.status'
    package: '@microsoft/teams.apps'
    summary: >-
      Lets callers branch without string-matching the message. `401` means the
      token itself was rejected; `403` means the identity lacks the grant, and
      the two have different remedies.
    fullName: status
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'status: number'
      return:
        description: ''
        type: number
