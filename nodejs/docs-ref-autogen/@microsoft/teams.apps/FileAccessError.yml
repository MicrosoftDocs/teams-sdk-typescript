  - name: stackTraceLimit
    uid: '@microsoft/teams.apps.FileAccessError.stackTraceLimit'
    package: '@microsoft/teams.apps'
    summary: >-
      The `Error.stackTraceLimit` property specifies the number of stack frames

      collected by a stack trace (whether generated by `new Error().stack` or

      `Error.captureStackTrace(obj)`).


      The default value is `10` but may be set to any valid JavaScript number.
      Changes

      will affect any stack trace captured _after_ the value has been changed.


      If set to a non-number value, or set to a negative number, stack traces
      will

      not capture any frames.
    fullName: stackTraceLimit
    remarks: ''
    isDeprecated: false
    syntax:
      content: 'static stackTraceLimit: number'
      return:
        description: ''
        type: number
    inheritanceDescription: >-
      <b>Inherited From</b>
      [FileError.stackTraceLimit](xref:@microsoft/teams.apps.FileError.stackTraceLimit)
inheritedMethods:
  - name: captureStackTrace(object, Function)
    uid: '@microsoft/teams.apps.FileAccessError.captureStackTrace'
    package: '@microsoft/teams.apps'
    summary: >-
      Creates a `.stack` property on `targetObject`, which when accessed returns

      a string representing the location in the code at which

      `Error.captureStackTrace()` was called.


      ```js

      const myObject = {};

      Error.captureStackTrace(myObject);

      myObject.stack;  // Similar to `new Error().stack`

      ```


      The first line of the trace will be prefixed with

      `${myObject.name}: ${myObject.message}`.


      The optional `constructorOpt` argument accepts a function. If given, all
      frames

      above `constructorOpt`, including `constructorOpt`, will be omitted from
      the

      generated stack trace.


      The `constructorOpt` argument is useful for hiding implementation

      details of error generation from the user. For instance:


      ```js

      function a() {
        b();
      }


      function b() {
        c();
      }


      function c() {
        // Create an error without stack trace to avoid calculating the stack trace twice.
        const { stackTraceLimit } = Error;
        Error.stackTraceLimit = 0;
        const error = new Error();
        Error.stackTraceLimit = stackTraceLimit;

        // Capture the stack trace above function b
        Error.captureStackTrace(error, b); // Neither function c, nor b is included in the stack trace
        throw error;
      }


      a();

      ```
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        static function captureStackTrace(targetObject: object, constructorOpt?:
        Function)
      parameters:
        - id: targetObject
          type: object
          description: ''
        - id: constructorOpt
          type: Function
          description: ''
    inheritanceDescription: >-
      <b>Inherited From</b>
      [FileError.captureStackTrace](xref:@microsoft/teams.apps.FileError.captureStackTrace)
