### YamlMime:TSTypeAlias
name: OAuthSignInCompleteHandler
uid: '@microsoft/teams.apps.OAuthSignInCompleteHandler'
package: '@microsoft/teams.apps'
summary: >-
  Called after an interactive OAuth flow obtains a token.


  Cached tokens returned directly by
  [OAuthFlow.signIn](xref:@microsoft/teams.apps.OAuthFlow.signIn) do not invoke

  this callback.
fullName: OAuthSignInCompleteHandler<TPlugin>
remarks: ''
isDeprecated: false
syntax: |
  type OAuthSignInCompleteHandler<TPlugin> = (
    context: IActivityContext<
      ISignInTokenExchangeInvokeActivity | ISignInVerifyStateInvokeActivity,
      PluginAdditionalContext<TPlugin>
    >,
    token: TokenResponse
  ) => void | Promise<void>
