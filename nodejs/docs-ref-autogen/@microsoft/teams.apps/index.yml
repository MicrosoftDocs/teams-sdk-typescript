  - name: createAgent365Scope(false | IAgent365ScopeOptions)
    uid: '@microsoft/teams.apps.createAgent365Scope'
    package: '@microsoft/teams.apps'
    summary: >-
      Builds a reusable
      [Agent365ScopeOpener](xref:@microsoft/teams.apps.Agent365ScopeOpener)
      bound to one set of options.

      Pass the same options given to `App`'s `telemetry.agent365` so proactive

      baggage matches reactive baggage, and build one per host to share.


      ```ts

      const withScope = createAgent365Scope({ operationSource: 'nightly-digest'
      });

      await withScope({ agenticIdentity, conversationId }, () => runJob());

      ```
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function createAgent365Scope(options?: false | IAgent365ScopeOptions):
        Agent365ScopeOpener
      parameters:
        - id: options
          type: false | <xref uid="@microsoft/teams.apps.IAgent365ScopeOptions" />
          description: >-
            host-wide baggage defaults and personal-data policy. Pass

            `false` to disable the bridge, which returns an opener that runs
            `fn`

            without touching the ambient context.
      return:
        description: ''
        type: <xref uid="@microsoft/teams.apps.Agent365ScopeOpener" />
