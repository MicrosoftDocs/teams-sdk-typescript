  - name: toThreadedConversationId(string, string)
    uid: '@microsoft/teams.apps.toThreadedConversationId'
    package: '@microsoft/teams.apps'
    summary: >-
      Constructs a threaded conversation ID by appending
      `;messageid={messageId}`

      to the conversation ID. This is the format the Teams service uses to route
      messages

      to a specific thread.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function toThreadedConversationId(conversationId: string, messageId:
        string): string
      parameters:
        - id: conversationId
          type: string
          description: the conversation to thread into (e.g. `19:abc@thread.skype`)
        - id: messageId
          type: string
          description: the thread root message ID (must be a non-zero numeric string)
      return:
        description: >-
          the threaded conversation ID (e.g.
          `19:abc@thread.skype;messageid=123`)
        type: string
  - name: 'tryGetWidgetModelContext({ value?: any } | null | undefined)'
    uid: '@microsoft/teams.apps.tryGetWidgetModelContext'
    package: '@microsoft/teams.apps'
    summary: >-
      Attempts to extract an MCP UI update-model-context request from a message

      activity's `value`. A widget can request that content be added to the
      model

      context by reusing the messageBack mechanism (like `Action.Submit` for

      adaptive cards). Such a request arrives as a normal message activity whose

      `value` carries the <xref:IMcpUiUpdateModelContextRequest> payload. This
      is

      fire-and-forget: the bot does not respond.


      This helper is tolerant of two wire shapes:
        1. The raw request object (`{ method: 'ui/update-model-context', params }`).
        2. An envelope of the form `{ type: 'widgetModelContext', data: <request> }`.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function tryGetWidgetModelContext(activity: { value?: any } | null |
        undefined): IMcpUiUpdateModelContextRequest | undefined
      parameters:
        - id: activity
          type: '{ value?: any } | null | undefined'
          description: A message activity (or any object with a `value` field).
      return:
        description: |-
          The parsed request, or `undefined` if `value` is not a valid
            update-model-context request.

           This API is in preview and may change in the future.
          Diagnostic: ExperimentalTeamsHtmlWidget
        type: >-
          <xref uid="@microsoft/teams.api.IMcpUiUpdateModelContextRequest" /> |
          undefined
  - name: validateSecurityPolicy(string, IHtmlWidgetSecurityPolicy)
    uid: '@microsoft/teams.apps.validateSecurityPolicy'
    package: '@microsoft/teams.apps'
    summary: >-
      Validates that external references in widget HTML are covered by the

      declared security policy. Returns an array of warnings for any

      references to origins not present in the appropriate policy field.


      This is a static analysis tool - it cannot catch dynamically constructed

      URLs (e.g. `fetch('https://' + domain)`). Use the `debugCspViolations`

      option on
      [injectWidgetProtocol](xref:@microsoft/teams.apps.injectWidgetProtocol)
      for runtime detection.


      Note: The CSP keyword `'self'` cannot be validated statically because it

      resolves to the iframe's parent origin at runtime. References that would

      be allowed by `'self'` may still produce warnings.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function validateSecurityPolicy(html: string, policy:
        IHtmlWidgetSecurityPolicy): ISecurityPolicyWarning[]
      parameters:
        - id: html
          type: string
          description: The raw HTML content of the widget.
        - id: policy
          type: <xref uid="@microsoft/teams.api.IHtmlWidgetSecurityPolicy" />
          description: The security policy to validate against.
      return:
        description: |-
          An array of warnings. Empty array means no issues found.

           This API is in preview and may change in the future.
          Diagnostic: ExperimentalTeamsHtmlWidget
        type: <xref uid="@microsoft/teams.apps.ISecurityPolicyWarning" />[]
  - name: withAgent365Baggage<T>(Agent365BaggageEntries, () => T)
    uid: '@microsoft/teams.apps.withAgent365Baggage'
    package: '@microsoft/teams.apps'
    summary: >-
      Runs `fn` with the supplied Agent365 baggage layered onto the active
      context.

      Supplied values win over existing baggage. Use in proactive flows to open
      an

      identity scope before creating the span it should describe.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function withAgent365Baggage<T>(values: Agent365BaggageEntries, fn: ()
        => T): T
      parameters:
        - id: values
          type: <xref uid="@microsoft/teams.apps.Agent365BaggageEntries" />
          description: the baggage entries to set. Blank and non-finite values are skipped.
        - id: fn
          type: () =&gt; T
          description: >-
            the function to run inside the scope. Its return value is passed
            through.
      return:
        description: ''
        type: T
