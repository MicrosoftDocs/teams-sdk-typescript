  - name: TeamsBotApplicationTelemetry
    uid: '@microsoft/teams.apps.TeamsBotApplicationTelemetry'
    package: '@microsoft/teams.apps'
    summary: >-
      OpenTelemetry source names used by the Teams bot application orchestration
      package.


      The SDK does not configure OpenTelemetry providers or exporters. Consumers
      configure

      their OpenTelemetry SDK/exporters and can use these names to filter
      app-layer signals.
    remarks: ''
