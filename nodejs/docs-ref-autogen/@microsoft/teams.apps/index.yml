  - name: injectWidgetProtocol(string, IInjectWidgetProtocolOptions)
    uid: '@microsoft/teams.apps.injectWidgetProtocol'
    package: '@microsoft/teams.apps'
    summary: >-
      Injects the MCP Apps protocol script into widget HTML.


      This is a convenience helper - widgets that implement the protocol
      themselves do not need to use it.

      [buildHtmlWidgetMarkdown](xref:@microsoft/teams.apps.buildHtmlWidgetMarkdown)
      calls this internally, so most developers won't call it directly.


      This sets up:

      - The ui/initialize handshake (required for rendering)

      - Size reporting via ui/notifications/size-changed

      - Optional notification hooks (opt-in via `notifications` option)


      If the HTML already contains the protocol (detected by the presence of
      `ui/initialize`), it is returned unchanged.
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        function injectWidgetProtocol(html: string, options?:
        IInjectWidgetProtocolOptions): string
      parameters:
        - id: html
          type: string
          description: The raw HTML content for the widget.
        - id: options
          type: <xref uid="@microsoft/teams.apps.IInjectWidgetProtocolOptions" />
          description: Optional configuration for the protocol setup.
      return:
        description: |-
          The HTML with the protocol script injected.

           This API is in preview and may change in the future.
          Diagnostic: ExperimentalTeamsHtmlWidget
        type: string
