### YamlMime:TSTypeAlias
name: MessageActivityInputOptions
uid: '@microsoft/teams.api.MessageActivityInputOptions'
package: '@microsoft/teams.api'
summary: >-
  Constructor fields for
  [MessageActivityInput](xref:@microsoft/teams.api.MessageActivityInput).


  This accepts modeled outbound message fields plus channel/service extension
  fields that

  should serialize at the top level of the outbound activity payload. The
  constructor owns

  the `type` discriminator and message `text`; pass text as the first
  constructor argument

  or set it with
  [withText](xref:@microsoft/teams.api.MessageActivityInput.withText).
fullName: MessageActivityInputOptions
remarks: ''
isDeprecated: false
syntax: |
  type MessageActivityInputOptions = Omit<
    Partial<IMessageActivityInput>,
    "type" | "text"
  > &
    Record<string, unknown>
