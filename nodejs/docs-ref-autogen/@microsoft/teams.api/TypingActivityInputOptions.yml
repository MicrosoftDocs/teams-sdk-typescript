summary: >-
  Constructor fields for
  [TypingActivityInput](xref:@microsoft/teams.api.TypingActivityInput).


  This accepts modeled outbound typing fields plus channel/service extension
  fields that

  should serialize at the top level of the outbound activity payload. The
  constructor owns

  the `type` discriminator; set typing text with the `text` field or

  [TypingActivityInput.withText](xref:@microsoft/teams.api.TypingActivityInput.withText).
