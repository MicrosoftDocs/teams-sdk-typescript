### YamlMime:TSTypeAlias
name: ActivityLike
uid: '@microsoft/teams.api.ActivityLike'
package: '@microsoft/teams.api'
summary: >-
  represents anything that can be transformed

  into an activity in an automated way.


  The structured-activity portion is narrowed to message/typing inputs rather
  than

  "any partial activity", so `send()`/`reply()`/`quote()` only accept what the
  app can send.
fullName: ActivityLike
remarks: ''
isDeprecated: false
syntax: |
  type ActivityLike =
    | IMessageActivityInput
    | ITypingActivityInput
    | string
    | IAdaptiveCard
