### YamlMime:TSType
name: IActivityInput
uid: '@microsoft/teams.api.IActivityInput'
package: '@microsoft/teams.api'
summary: >-
  Base shape for an OUTBOUND activity the app constructs and sends.


  This is intentionally not derived from all of
  [IActivity](xref:@microsoft/teams.api.IActivity): inbound/server-filled

  fields such as `from`, `conversation`, `channelId`, `serviceUrl`, and
  timestamps are

  filled by the sender or service, not by callers constructing outbound input.
fullName: IActivityInput<T>
remarks: ''
isDeprecated: false
type: interface
