### YamlMime:TSTypeAlias
name: FileDownloadInfo
uid: '@microsoft/teams.api.FileDownloadInfo'
package: '@microsoft/teams.api'
summary: >-
  An interface representing FileDownloadInfo.

  The content of a `file.download.info` attachment, describing an uploaded file
  received in a personal (1:1) chat.

  The file is fetched from the short-lived, pre-authorized `downloadUrl` with a
  plain GET (no bearer token).
fullName: FileDownloadInfo
remarks: ''
isDeprecated: false
syntax: |
  type FileDownloadInfo = {
    downloadUrl?: string
    etag?: string
    fileType?: string
    uniqueId?: string
  }
