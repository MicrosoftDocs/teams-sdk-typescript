### YamlMime:TSType
name: IMessageActivityInput
uid: '@microsoft/teams.api.IMessageActivityInput'
package: '@microsoft/teams.api'
summary: >-
  OUTBOUND message activity — what the app SENDS.


  All server-populated base fields optional (via
  [IActivityInput](xref:@microsoft/teams.api.IActivityInput)) and the

  message-specific fields optional too, so both a plain `{ type: 'message', text
  }`

  literal and a
  [MessageActivityInput](xref:@microsoft/teams.api.MessageActivityInput) builder
  instance are assignable. The message

  fields are copied here instead of derived from
  [IMessageActivity](xref:@microsoft/teams.api.IMessageActivity), keeping the

  outbound input shape independent from the inbound activity interface. Use

  [MessageActivityInputOptions](xref:@microsoft/teams.api.MessageActivityInputOptions)
  to include unmodeled extension fields when constructing

  a [MessageActivityInput](xref:@microsoft/teams.api.MessageActivityInput).
fullName: IMessageActivityInput
remarks: ''
isDeprecated: false
