### YamlMime:TSTypeAlias
name: TokenProviderFn
uid: '@microsoft/teams.api.TokenProviderFn'
package: '@microsoft/teams.api'
summary: >-
  The simplest way to supply your own tokens: one callback for every request.

  Sufficient for apps that only ever authenticate as themselves; apps that need

  Agentic User or Agentic App tokens should supply an
  [ITokenProvider](xref:@microsoft/teams.api.ITokenProvider)

  instead.
fullName: TokenProviderFn
remarks: ''
isDeprecated: false
syntax: |
  type TokenProviderFn = (
    scope: string | string[],
    tenantId?: string
  ) => string | Promise<string>
