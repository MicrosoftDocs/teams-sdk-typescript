name: AgenticIdentity
uid: '@microsoft/teams.api.AgenticIdentity'
package: '@microsoft/teams.api'
summary: |-
  SDK operation/request scope for the Agent 365 program.

  An AgenticIdentity encompasses an agentic app blueprint
  (`agenticAppBlueprintId`), which can instantiate agentic apps
  (`agenticAppId`), and each app can optionally have associated agentic users
  (`agenticUserId`).
fullName: AgenticIdentity
remarks: ''
isDeprecated: false
syntax: |
  type AgenticIdentity = {
    agenticAppBlueprintId: string
    agenticAppId?: string | null
    agenticUserId?: string | null
    tenantId?: string
  }
