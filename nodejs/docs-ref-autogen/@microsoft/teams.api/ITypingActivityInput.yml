### YamlMime:TSType
name: ITypingActivityInput
uid: '@microsoft/teams.api.ITypingActivityInput'
package: '@microsoft/teams.api'
summary: >-
  OUTBOUND typing activity — the typing indicator the app SENDS.


  All server-populated base fields optional (via
  [IActivityInput](xref:@microsoft/teams.api.IActivityInput)) and the

  typing-specific fields optional too, so both a plain `{ type: 'typing' }`
  literal

  and a [TypingActivityInput](xref:@microsoft/teams.api.TypingActivityInput)
  builder instance are assignable. The typing fields are

  copied here instead of derived from
  [ITypingActivity](xref:@microsoft/teams.api.ITypingActivity), keeping the
  outbound input

  shape independent from the inbound activity interface. Use
  [TypingActivityInputOptions](xref:@microsoft/teams.api.TypingActivityInputOptions)

  to include unmodeled extension fields when constructing a
  [TypingActivityInput](xref:@microsoft/teams.api.TypingActivityInput).
fullName: ITypingActivityInput
remarks: ''
isDeprecated: false
type: interface
