name: IHtmlWidgetPayload
uid: '@microsoft/teams.api.IHtmlWidgetPayload'
package: '@microsoft/teams.api'
summary: |-
  The JSON payload for an HTML widget, sent inside a ```html-widget code block
  within a Markdown message.

   This API is in preview and may change in the future.
  Diagnostic: ExperimentalTeamsHtmlWidget
fullName: IHtmlWidgetPayload
remarks: ''
isDeprecated: false
type: interface
properties:
