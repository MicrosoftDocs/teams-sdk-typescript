    summary: >-
      `POST
      /education/classes/{educationClass-id}/assignments/{educationAssignment-id}/submissions/{educationSubmission-id}/resources`


      Add a educationSubmissionResource to a submission resource list. Only
      teachers and students can perform this operation. The operation will not
      succeed if the allowStudentsToAddResources flag is not set to true. To
      create a new file-based resource, upload the file to the resources folder
      associated with the submission. If the file doesn&#x27;t exist or is not
      in that folder, the POST request will fail.
