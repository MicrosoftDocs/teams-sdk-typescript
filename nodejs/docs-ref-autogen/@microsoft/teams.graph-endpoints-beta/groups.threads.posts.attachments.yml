  - name: createUploadSession
    uid: >-
      @microsoft/teams.graph-endpoints-beta.groups.threads.posts.attachments.createUploadSession
    package: '@microsoft/teams.graph-endpoints-beta'
    summary: ''
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
        createUploadSession: { /** * `POST
        /groups/{group-id}/threads/{conversationThread-id}/posts/{post-id}/attachments/createUploadSession`
        * * Create an upload session that allows an app to iteratively upload
        ranges of a file, so as to attach the file to an Outlook item. The item
        can be a message or event. Use this approach to attach a file if the
        file size is between 3 MB and 150 MB. To attach a file that&#x27;s
        smaller than 3 MB, do a POST operation on the attachments navigation
        property of the Outlook item; see how to do this for a message or for an
        event. As part of the response, this action returns an upload URL that
        you can use in subsequent sequential PUT queries. Request headers for
        each PUT operation let you specify the exact range of bytes to be
        uploaded. This allows transfer to be resumed, in case the network
        connection is dropped during upload. The following are the steps to
        attach a file to an Outlook item using an upload session: See attach
        large files to Outlook messages or events for an example. */ create:
        (body: IEndpoints["POST
        /groups/{group-id}/threads/{conversationThread-id}/posts/{post-id}/attachments/createUploadSession"]["body"],
        params?: IEndpoints["POST
        /groups/{group-id}/threads/{conversationThread-id}/posts/{post-id}/attachments/createUploadSession"]["parameters"])
        => EndpointRequest<IEndpoints["POST
        /groups/{group-id}/threads/{conversationThread-id}/posts/{post-id}/attachments/createUploadSession"]["response"]>;
        }
