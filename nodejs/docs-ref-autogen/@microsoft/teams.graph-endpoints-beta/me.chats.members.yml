    summary: >-
      `GET /me/chats/{chat-id}/members`


      List all conversation members in a chat. This method supports federation.
      For one-on-one chats, at least one chat member must belong to the tenant
      the request initiates from. For group chats, the chat must be initiated by
      a user in the tenant the request initiates from.
