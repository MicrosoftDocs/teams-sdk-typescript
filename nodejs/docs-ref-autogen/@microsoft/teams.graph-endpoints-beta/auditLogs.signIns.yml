    uid: '@microsoft/teams.graph-endpoints-beta.auditLogs.signIns.list'
    package: '@microsoft/teams.graph-endpoints-beta'
    summary: >-
      `GET /auditLogs/signIns`


      Get a list of signIn objects. The list contains the user sign-ins for your
      Microsoft Entra tenant. Sign-ins where a username and password are passed
      as part of authorization token, and successful federated sign-ins are
      currently included in the sign-in logs. The maximum and default page size
      is 1,000 objects and by default, the most recent sign-ins are returned
      first. Only sign-in events that occurred within the Microsoft Entra ID
      default retention period are available.
