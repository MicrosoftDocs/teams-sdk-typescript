    summary: >-
      `POST
      /identityGovernance/entitlementManagement/accessPackageResourceRequests`


      Create a new accessPackageResourceRequest object to request the addition
      of a resource to an access package catalog, update of a resource, or the
      removal of a resource from a catalog.  A resource must be included in an
      access package catalog before a role of that resource can be added to an
      access package.
