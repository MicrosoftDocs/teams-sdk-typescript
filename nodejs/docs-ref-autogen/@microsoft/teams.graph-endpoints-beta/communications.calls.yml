        response from a caller after they&#x27;re prompted for a response. For
        more information about how to handle operations, see commsOperation.
        This action isn&#x27;t intended to record the entire call. The maximum
        length of recording is 2 minutes.The Cloud Communications Platform
        doesn&#x27;t save the recording permanently and discards it shortly
        after the call ends. The bot must download the recording promptly after
