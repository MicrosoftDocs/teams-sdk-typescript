    syntax:
      content: >-
        setUserPreferredPresence: { /** * `POST
        /me/presence/setUserPreferredPresence` * * Set the preferred
        availability and activity status for a user. If the preferred presence
        of a user is set, the user&#x27;s presence is the preferred presence.
        Preferred presence takes effect only when there is at least one presence
        session of the user. Otherwise, the user&#x27;s presence stays as
        Offline. A presence session can be created as a result of a successful
        setPresence operation, or if the user is signed in on a Teams client.
        Read more about presence sessions and their time-out and expiration. */
        create: (body: IEndpoints["POST
