### YamlMime:TSTypeAlias
name: UseTeamsSdkOptions
uid: '@microsoft/teams.m365extensions.UseTeamsSdkOptions'
package: '@microsoft/teams.m365extensions'
summary: |-
  Options forwarded to the internally-created teams.ts <xref:App>.

  Mirrors `AppOptions` but omits the identity/credential keys the bridge owns
  (`clientId`, `tenantId`, `token`) — those are derived from the host Agents
  SDK connection, so passing them is rejected.
fullName: UseTeamsSdkOptions<TPlugin>
remarks: ''
isDeprecated: false
syntax: |
  type UseTeamsSdkOptions<TPlugin> = Omit<
    AppOptions<TPlugin>,
    (typeof RESERVED_KEYS)[number]
  >
