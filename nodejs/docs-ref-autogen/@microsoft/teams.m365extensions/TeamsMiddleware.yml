### YamlMime:TSType
name: TeamsMiddleware
uid: '@microsoft/teams.m365extensions.TeamsMiddleware'
package: '@microsoft/teams.m365extensions'
summary: >-
  Agents SDK middleware that routes matching Teams activities to a teams.ts

  <xref:App>, and lets everything else fall through to the host app.


  For each turn it: ignores non-Teams channels; honors
  [ShouldBypassTeams](xref:@microsoft/teams.m365extensions.ShouldBypassTeams);

  and, for a Teams turn, hands off to teams.ts only when the app has a matching

  route (via `App.hasMatchingRoute`) — otherwise calling `next()` so the host

  app can handle it. Invoke responses produced by teams.ts are propagated back

  through the Agents SDK pipeline. Constructed for you by
  [useTeamsSdk](xref:@microsoft/teams.m365extensions.useTeamsSdk).
fullName: TeamsMiddleware
