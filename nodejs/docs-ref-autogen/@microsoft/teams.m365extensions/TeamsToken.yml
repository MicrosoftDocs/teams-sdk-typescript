### YamlMime:TSType
name: TeamsToken
uid: '@microsoft/teams.m365extensions.TeamsToken'
package: '@microsoft/teams.m365extensions'
summary: |-
  A short-lived token describing the bot identity for a single inbound Teams
  activity, derived from the activity's `recipient`/`conversation`/`serviceUrl`.

  teams.ts uses this (via <xref:IToken>) to mint the outbound credentials for
  API calls made while handling the turn, so the bridge does not need its own
  long-lived credential — it reuses the host Agents SDK app's identity.
fullName: TeamsToken
remarks: ''
isDeprecated: false
type: class
constructors:
  - name: >-
      TeamsToken({ appDisplayName?: string, appId: string, serviceUrl?: string,
      tenantId?: string })
    uid: '@microsoft/teams.m365extensions.TeamsToken.constructor'
    package: '@microsoft/teams.m365extensions'
    summary: ''
    remarks: ''
    isDeprecated: false
    syntax:
      content: >-
