### YamlMime:TSPackage
uid: '@microsoft/teams.m365extensions'
name: '@microsoft/teams.m365extensions'
summary: ''
type: package
classes:
  - '@microsoft/teams.m365extensions.TeamsMiddleware'
  - '@microsoft/teams.m365extensions.TeamsToken'
typeAliases:
  - '@microsoft/teams.m365extensions.AgentSdkConnections'
